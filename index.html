<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Mirrors src/design/tokens/palette.js's deriveFullPalette — keep the two
      // in sync (AGENT_RULES.md § 3).
      // Duplicated here (rather than imported) so the palette can apply before
      // first paint, avoiding a flash of default colors while React/the module
      // bundle loads.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute(
            'data-density',
            localStorage.getItem('density') === 'compact' ? 'compact' : 'comfortable'
          );
          document.documentElement.setAttribute(
            'data-motion',
            localStorage.getItem('reduceMotion') === 'true' ? 'reduced' : 'auto'
          );

          var accent = localStorage.getItem('accentColor');
          if (accent) {
            var DEFAULT_HUE = 32;

            var hexToRgb = function (hex) {
              var clean = hex.replace('#', '');
              if (clean.length === 3) clean = clean.split('').map(function (c) { return c + c; }).join('');
              var num = parseInt(clean, 16);
              return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
            };

            var rgbToHex = function (rgb) {
              return '#' + ['r', 'g', 'b'].map(function (k) {
                return Math.round(Math.max(0, Math.min(255, rgb[k]))).toString(16).padStart(2, '0');
              }).join('');
            };

            var rgbToHsl = function (rgb) {
              var rn = rgb.r / 255, gn = rgb.g / 255, bn = rgb.b / 255;
              var max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
              var delta = max - min, l = (max + min) / 2;
              if (delta < 0.001) return { h: DEFAULT_HUE, s: 0, l: l * 100 };
              var s = delta / (1 - Math.abs(2 * l - 1));
              var h;
              if (max === rn) h = ((gn - bn) / delta) % 6;
              else if (max === gn) h = (bn - rn) / delta + 2;
              else h = (rn - gn) / delta + 4;
              h *= 60;
              if (h < 0) h += 360;
              return { h: h, s: s * 100, l: l * 100 };
            };

            var hslToRgb = function (hsl) {
              var sn = hsl.s / 100, ln = hsl.l / 100;
              var c = (1 - Math.abs(2 * ln - 1)) * sn;
              var x = c * (1 - Math.abs(((hsl.h / 60) % 2) - 1));
              var m = ln - c / 2;
              var rgb;
              if (hsl.h < 60) rgb = [c, x, 0];
              else if (hsl.h < 120) rgb = [x, c, 0];
              else if (hsl.h < 180) rgb = [0, c, x];
              else if (hsl.h < 240) rgb = [0, x, c];
              else if (hsl.h < 300) rgb = [x, 0, c];
              else rgb = [c, 0, x];
              return { r: (rgb[0] + m) * 255, g: (rgb[1] + m) * 255, b: (rgb[2] + m) * 255 };
            };

            var hslToHex = function (hsl) { return rgbToHex(hslToRgb(hsl)); };

            var relativeLuminance = function (rgb) {
              var srgb = [rgb.r, rgb.g, rgb.b].map(function (v) {
                var s = v / 255;
                return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
              });
              return 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
            };

            var baseHsl = rgbToHsl(hexToRgb(accent));
            var h = baseHsl.h;

            var accentTarget =
              theme === 'dark'
                ? { h: h, s: Math.max(baseHsl.s, 62), l: 64 }
                : { h: h, s: Math.min(Math.max(baseHsl.s, 52), 72), l: 36 };
            var accentHex = hslToHex(accentTarget);
            var accentRgb = hexToRgb(accentHex);
            var accentIsLight = relativeLuminance(accentRgb) > 0.45;
            var accentContrast = accentIsLight ? '#141310' : '#fbf9f3';
            var hoverTarget = accentIsLight ? 0 : 255;
            var accentHover = '#' + ['r', 'g', 'b'].map(function (k) {
              return Math.round(accentRgb[k] + (hoverTarget - accentRgb[k]) * 0.18).toString(16).padStart(2, '0');
            }).join('');

            // Paper/ink role targets — only hue comes from the picked color.
            var roles = theme === 'dark'
              ? {
                  bg: { s: 12, l: 6 }, surface: { s: 11, l: 10 }, text: { s: 16, l: 93 },
                  muted: { s: 9, l: 58 }, border: { s: 10, l: 24 }, rule: { s: 12, l: 34 },
                }
              : {
                  bg: { s: 20, l: 94 }, surface: { s: 30, l: 97.5 }, text: { s: 24, l: 9 },
                  muted: { s: 10, l: 40 }, border: { s: 14, l: 79 }, rule: { s: 14, l: 66 },
                };

            var root = document.documentElement.style;
            root.setProperty('--bg', hslToHex({ h: h, s: roles.bg.s, l: roles.bg.l }));
            root.setProperty('--surface', hslToHex({ h: h, s: roles.surface.s, l: roles.surface.l }));
            root.setProperty('--text', hslToHex({ h: h, s: roles.text.s, l: roles.text.l }));
            root.setProperty('--muted', hslToHex({ h: h, s: roles.muted.s, l: roles.muted.l }));
            root.setProperty('--border', hslToHex({ h: h, s: roles.border.s, l: roles.border.l }));
            root.setProperty('--rule', hslToHex({ h: h, s: roles.rule.s, l: roles.rule.l }));
            root.setProperty('--accent', accentHex);
            root.setProperty('--accent-hover', accentHover);
            root.setProperty('--accent-contrast', accentContrast);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mindful — a paper-quiet logbook for mood, habits, and thought records."
    />
    <!-- The browser chrome in each theme: --bg from design/tokens/tokens.css,
         duplicated here as the pre-paint script above duplicates the palette. -->
    <meta name="theme-color" content="#efece2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0d0b" media="(prefers-color-scheme: dark)" />

    <!-- Link previews. Static on purpose: a shared link must never carry
         anything about the person who shared it. Image source:
         src/design/assets/sources/og-image.svg. -->

    <meta

      content="A quiet logbook for mood, habits and thought records — kept privately, and read back to you in your own words."
    />
    <meta property="og:url" content="https://website-1wf9.vercel.app/" />
    <meta property="og:image" content="https://website-1wf9.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta

    />

    <meta name="twitter:title" content="Mindful — The Almanac" />

      content="A quiet logbook for mood, habits and thought records — kept privately."

    <meta name="twitter:image" content="https://website-1wf9.vercel.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Mindful — The Almanac</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
